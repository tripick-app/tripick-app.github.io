name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out site source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test COS publishing safeguards
        run: pnpm test:cos

      - name: Build versioned COS assets
        run: pnpm build:cos

      - name: Install pinned COSCLI
        run: node scripts/install-coscli.mjs

      - name: Prepare temporary COS credentials
        env:
          TRIPICK_COS_SECRET_ID: ${{ secrets.TRIPICK_COS_SECRET_ID }}
          TRIPICK_COS_SECRET_KEY: ${{ secrets.TRIPICK_COS_SECRET_KEY }}
        run: node scripts/cos-auth-config.mjs prepare

      - name: Upload and verify COS assets
        run: pnpm cos:upload

      - name: Remove temporary COS credentials
        if: always()
        run: node scripts/cos-auth-config.mjs cleanup

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
